services:
  - type: web
    name: credential-chain-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && node dist/main
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_VERIFY_BASE_URL
        value: https://your-vercel-app.vercel.app/verify   # update after Vercel deploy
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard
