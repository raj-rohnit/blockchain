services:
  postgres:
    image: postgres:16-alpine
    container_name: credential_chain_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: credchain
      POSTGRES_PASSWORD: credchain_pass
      POSTGRES_DB: credential_chain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credchain -d credential_chain"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: credential_chain_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
